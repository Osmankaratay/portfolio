<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Osman Karatay | Matrix 3D Portfolyo</title>
  
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  
  <!-- Three.js for 3D Simulation & Tone.js for Procedural Audio -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>

  <style>
    :root {
      --matrix-green: #00ff66;
      --matrix-glow: rgba(0, 255, 102, 0.4);
      --matrix-dark: #030d06;
      --matrix-dim: #008f39;
    }
    
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #020603;
      font-family: 'Share Tech Mono', monospace;
      color: #bbf7d0;
      user-select: none;
    }
    
    /* CRT Scanline & Phosphor Overlay */
    .crt-overlay {
      pointer-events: none;
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.28) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      background-size: 100% 3px, 6px 100%;
      z-index: 20;
    }

    .vignette {
      pointer-events: none;
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 45%, rgba(0, 5, 2, 0.85) 100%);
      z-index: 19;
    }

    /* Glow text utilities */
    .glow-green {
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.7), 0 0 20px rgba(0, 255, 102, 0.3);
    }
    
    .glow-box {
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.25), inset 0 0 15px rgba(0, 255, 102, 0.1);
      border: 1px solid rgba(0, 255, 102, 0.4);
    }

    /* Custom scrollbars for modal content */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #031408;
    }
    ::-webkit-scrollbar-thumb {
      background: #00aa44;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00ff66;
    }

    /* Matrix Rain Animation Keyframes */
    @keyframes pulseCode {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.6; }
    }
    
    .pulse-code {
      animation: pulseCode 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="relative w-screen h-screen">

  <!-- CRT & Vignette layers -->
  <div class="crt-overlay"></div>
  <div class="vignette"></div>

  <!-- 3D Canvas Container -->
  <div id="canvas-container" class="absolute inset-0 cursor-grab active:cursor-grabbing z-0"></div>

  <!-- Top Matrix Header HUD -->
  <header class="absolute top-4 left-6 right-6 flex justify-between items-center z-30 pointer-events-none">
    <div class="flex items-center space-x-3 pointer-events-auto bg-black/60 px-4 py-2 rounded border border-green-500/30 backdrop-blur-sm">
      <div class="w-3 h-3 rounded-full bg-green-500 animate-ping"></div>
      <div>
        <h1 class="text-xl md:text-2xl font-bold tracking-wider text-green-400 glow-green font-['Orbitron']">OSMAN KARATAY</h1>
        <p class="text-xs text-green-300/80 font-mono">İSTATİSTİKÇİ & OYUN GELİŞTİRİCİ // SİMÜLASYON BAĞLANTISI AKTİF</p>
      </div>
    </div>

    <!-- Audio & Instructions Control -->
    <div class="flex items-center space-x-3 pointer-events-auto">
      <button id="audio-toggle-btn" class="bg-black/60 hover:bg-green-950/80 text-green-400 px-3 py-2 rounded text-xs border border-green-500/40 flex items-center space-x-2 transition-all glow-box">
        <span id="audio-icon">🔇</span>
        <span id="audio-label">SESİ AÇ</span>
      </button>
      <button id="reset-cam-btn" class="bg-black/60 hover:bg-green-950/80 text-green-400 px-3 py-2 rounded text-xs border border-green-500/40 transition-all glow-box">
        MASAYA BAKIŞI SIFIRLA
      </button>
    </div>
  </header>

  <!-- Bottom Floating Interactive Target Indicator -->
  <footer class="absolute bottom-5 left-1/2 -translate-x-1/2 z-30 pointer-events-none">
    <div id="interaction-hud" class="bg-black/80 border border-green-500/60 px-6 py-2.5 rounded-full text-center backdrop-blur-md transition-all duration-300 shadow-lg shadow-green-900/30">
      <p id="target-label" class="text-sm md:text-base text-green-300 glow-green font-mono">
        👁️ Masa üzerindeki 3D nesneleri keşfetmek için tıklayın
      </p>
    </div>
  </footer>

  <!-- Modal Overlays for Items -->
  <div id="modal-backdrop" class="fixed inset-0 bg-black/85 backdrop-blur-md hidden z-40 items-center justify-center p-4 md:p-8 transition-opacity duration-300">
    <div id="modal-card" class="bg-[#041108] border-2 border-green-500 w-full max-w-4xl max-h-[90vh] rounded-xl flex flex-col shadow-2xl shadow-green-500/20 overflow-hidden transform scale-95 transition-transform duration-300">
      
      <!-- Modal Header -->
      <div class="px-6 py-4 bg-green-950/40 border-b border-green-500/40 flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <span id="modal-icon" class="text-2xl">🖥️</span>
          <div>
            <h2 id="modal-title" class="text-xl md:text-2xl font-bold text-green-400 font-['Orbitron'] tracking-wide glow-green">BAŞLIK</h2>
            <p id="modal-subtitle" class="text-xs text-green-300/70 font-mono">SİSTEM PROTOKOLÜ // O. KARATAY</p>
          </div>
        </div>
        <button id="modal-close-btn" class="w-10 h-10 rounded-lg border border-green-500/50 hover:bg-green-500/20 flex items-center justify-center text-green-400 text-2xl transition-colors">
          ✕
        </button>
      </div>

      <!-- Modal Dynamic Body -->
      <div id="modal-body" class="p-6 overflow-y-auto space-y-6 text-green-200 font-['Share_Tech_Mono']">
        <!-- Injected via JavaScript based on selected item -->
      </div>
    </div>
  </div>

  <script>
  // --- SOUND EFFECTS (TONE.JS) ---
  let soundEnabled = false;
  let synth, noiseSynth, membraneSynth;

  function initAudio() {
    if (synth) return;
    try {
      Tone.start();
      synth = new Tone.PolySynth(Tone.Synth, {
        oscillator: { type: "sawtooth8" },
        envelope: { attack: 0.005, decay: 0.1, sustain: 0.05, release: 0.2 }
      }).toDestination();
      synth.volume.value = -12;

      noiseSynth = new Tone.NoiseSynth({
        noise: { type: "white" },
        envelope: { attack: 0.001, decay: 0.05, sustain: 0 }
      }).toDestination();
      noiseSynth.volume.value = -18;

      membraneSynth = new Tone.MembraneSynth().toDestination();
      membraneSynth.volume.value = -14;
    } catch (e) {
      console.warn("Ses motoru başlatılamadı:", e);
    }
  }

  function playSound(type) {
    if (!soundEnabled) return;
    try {
      if (type === 'hover') {
        synth && synth.triggerAttackRelease("C6", "32n", Tone.now(), 0.15);
      } else if (type === 'click') {
        synth && synth.triggerAttackRelease(["E5", "G#5", "B5"], "16n");
        noiseSynth && noiseSynth.triggerAttackRelease("32n");
      } else if (type === 'phone') {
        synth && synth.triggerAttackRelease("A5", "16n", Tone.now());
        synth && synth.triggerAttackRelease("E6", "16n", Tone.now() + 0.08);
      } else if (type === 'paper') {
        noiseSynth && noiseSynth.triggerAttackRelease("16n");
      } else if (type === 'matrix') {
        synth && synth.triggerAttackRelease(["C5", "G5", "D#6"], "8n");
      }
    } catch (err) {}
  }

  // Audio Toggle Button
  const audioBtn = document.getElementById('audio-toggle-btn');
  const audioIcon = document.getElementById('audio-icon');
  const audioLabel = document.getElementById('audio-label');
  
  audioBtn.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    if (soundEnabled) {
      initAudio();
      audioIcon.textContent = '🔊';
      audioLabel.textContent = 'SES AÇIK';
      audioBtn.classList.add('bg-green-950/60', 'text-green-300');
      playSound('matrix');
    } else {
      audioIcon.textContent = '🔇';
      audioLabel.textContent = 'SESİ AÇ';
      audioBtn.classList.remove('bg-green-950/60');
    }
  });

  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x020704);
  scene.fog = new THREE.FogExp2(0x020704, 0.035);

  // Standing First-Person Camera Looking Down at Desk
  const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 100);
  const defaultCamPos = new THREE.Vector3(0, 5.2, 5.5);
  const defaultLookAt = new THREE.Vector3(0, -0.3, 0.2);
  camera.position.copy(defaultCamPos);
  camera.lookAt(defaultLookAt);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  // Lights: Ambient Room Darkness + Focused Green Matrix Lamp + Phosphor CRT Glow
  const ambientLight = new THREE.AmbientLight(0x0a2414, 1.2);
  scene.add(ambientLight);

  const overheadSpot = new THREE.SpotLight(0x88ffaa, 2.5, 20, Math.PI / 4, 0.4, 1.2);
  overheadSpot.position.set(0, 9, 3);
  overheadSpot.castShadow = true;
  overheadSpot.shadow.mapSize.width = 1024;
  overheadSpot.shadow.mapSize.height = 1024;
  scene.add(overheadSpot);

  // CRT Screen Emitter Light (Green phosphor)
  const crtGlowLight = new THREE.PointLight(0x00ff66, 3.2, 5.5);
  crtGlowLight.position.set(0, 1.8, -0.5);
  scene.add(crtGlowLight);

  // Warm Side Ambient for Realistic Depth
  const warmSideLight = new THREE.PointLight(0xffcc88, 0.6, 8);
  warmSideLight.position.set(-4, 3, 2);
  scene.add(warmSideLight);

  // Dedicated Offscreen Canvas for CRT Display Falling Code Rain & Vortex (Kuyuya Düşme Efekti)
  const crtCanvas = document.createElement('canvas');
  crtCanvas.width = 512;
  crtCanvas.height = 512;
  const crtCtx = crtCanvas.getContext('2d');

  const matrixChars = "アイウエオカキクケコサシスセソタチツテトナニヌネハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789OSMANKARATAYΔΣπ∫√";
  const vortexRings = 14;

  function updateCrtMatrixScreen(time) {
    const cx = crtCanvas.width / 2;
    const cy = crtCanvas.height / 2;

    // Dark phosphor CRT base with progressive trail fading
    crtCtx.fillStyle = "rgba(1, 14, 5, 0.22)";
    crtCtx.fillRect(0, 0, crtCanvas.width, crtCanvas.height);

    // 1. Digital Well / Vortex Tunnel Effect (Kuyuya Düşme Perspektifi)
    const wellDepthOffset = (time * 1.8) % 1.0;
    for (let r = 0; r < vortexRings; r++) {
      const progress = (r + wellDepthOffset) / vortexRings;
      const radius = Math.pow(progress, 2.2) * (crtCanvas.width * 0.68);
      const alpha = Math.sin(progress * Math.PI) * 0.45;

      crtCtx.strokeStyle = `rgba(0, 255, 102, ${alpha})`;
      crtCtx.lineWidth = 1.2 + progress * 2;
      crtCtx.beginPath();
      // Elliptical perspective to give depth towards bottom-center
      crtCtx.ellipse(cx, cy + (1 - progress) * 20, Math.max(1, radius), Math.max(1, radius * 0.78), 0, 0, Math.PI * 2);
      crtCtx.stroke();
    }

    // 2. Converging Vortex Tunnel Ribs (Merkeze Çekilen Kuyu Çizgileri)
    crtCtx.strokeStyle = "rgba(0, 255, 102, 0.12)";
    crtCtx.lineWidth = 1;
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 6) {
      const angle = a + time * 0.25;
      crtCtx.beginPath();
      crtCtx.moveTo(cx, cy);
      crtCtx.lineTo(cx + Math.cos(angle) * 320, cy + Math.sin(angle) * 260);
      crtCtx.stroke();
    }

    // 3. Falling Matrix Glyphs Spiraling into the Center Well
    const glyphCount = 36;
    for (let i = 0; i < glyphCount; i++) {
      const spiralPhase = ((i * 0.35) + (time * 1.6)) % (Math.PI * 4);
      const distRatio = Math.max(0.04, 1.0 - (spiralPhase / (Math.PI * 4)));
      const dist = distRatio * 220;
      const angle = spiralPhase * 1.5 + i;

      const gx = cx + Math.cos(angle) * dist;
      const gy = (cy + 15) + Math.sin(angle) * (dist * 0.75);
      const char = matrixChars[(i * 7 + Math.floor(time * 10)) % matrixChars.length];

      const fontSize = Math.max(8, Math.floor(distRatio * 20));
      crtCtx.font = `bold ${fontSize}px 'Share Tech Mono', monospace`;
      
      if (distRatio > 0.8) {
        crtCtx.fillStyle = "#ffffff";
        crtCtx.shadowColor = "#00ff66";
        crtCtx.shadowBlur = 8;
      } else {
        crtCtx.fillStyle = `rgba(0, 255, 102, ${distRatio * 0.95})`;
        crtCtx.shadowBlur = 2;
      }
      crtCtx.fillText(char, gx, gy);
    }

    // 4. Center Glowing Abyss Core (Kuyu Parıltı Merkezi)
    const coreGrad = crtCtx.createRadialGradient(cx, cy + 15, 2, cx, cy + 15, 85);
    coreGrad.addColorStop(0, "rgba(220, 255, 235, 0.95)");
    coreGrad.addColorStop(0.3, "rgba(0, 255, 102, 0.55)");
    coreGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
    crtCtx.fillStyle = coreGrad;
    crtCtx.beginPath();
    crtCtx.arc(cx, cy + 15, 85, 0, Math.PI * 2);
    crtCtx.fill();

    // 5. Interactive HUD Text Overlay
    crtCtx.textAlign = "center";
    crtCtx.shadowColor = "#00ff66";
    crtCtx.shadowBlur = 10;
    
    crtCtx.fillStyle = "#a7f3d0";
    crtCtx.font = "bold 13px 'Orbitron', monospace";
    crtCtx.fillText("[ TÜPLÜ CRT SİSTEMİ // NEO-1999 ]", cx, cy - 110);

    crtCtx.fillStyle = "#ffffff";
    crtCtx.font = "bold 22px 'Orbitron', monospace";
    crtCtx.fillText("OYUN GELİŞTİRME", cx, cy - 75);

    crtCtx.fillStyle = "#34d399";
    crtCtx.font = "14px 'Share Tech Mono', monospace";
    crtCtx.fillText("▶ Geliştirilen Oyunlar & Fikirler ◀", cx, cy - 50);

    crtCtx.fillStyle = "#00ff66";
    crtCtx.font = "bold 15px 'Share Tech Mono', monospace";
    crtCtx.fillText("▼ GİRİŞ YAPMAK İÇİN MONİTÖRE TIKLA ▼", cx, cy + 125);

    // 6. Phosphor Scanline Overlay & Curved Tube Vignette
    crtCtx.fillStyle = "rgba(0, 0, 0, 0.38)";
    for (let y = 0; y < crtCanvas.height; y += 4) {
      crtCtx.fillRect(0, y, crtCanvas.width, 1.5);
    }

    // Vignette shadow around curved tube corners
    const borderVignette = crtCtx.createRadialGradient(cx, cy, 180, cx, cy, 260);
    borderVignette.addColorStop(0, "rgba(0,0,0,0)");
    borderVignette.addColorStop(1, "rgba(0, 10, 3, 0.75)");
    crtCtx.fillStyle = borderVignette;
    crtCtx.fillRect(0, 0, crtCanvas.width, crtCanvas.height);

    crtTexture.needsUpdate = true;
  }

  const crtTexture = new THREE.CanvasTexture(crtCanvas);

  // 1. Procedural Desk Texture (Wooden borders fading into Matrix cyber grid near CRT)
  const deskCanvas = document.createElement('canvas');
  deskCanvas.width = 1024;
  deskCanvas.height = 1024;
  const deskCtx = deskCanvas.getContext('2d');

  // Base wood finish
  deskCtx.fillStyle = "#1e140d";
  deskCtx.fillRect(0, 0, 1024, 1024);
  deskCtx.strokeStyle = "rgba(10, 6, 3, 0.4)";
  for (let i = 0; i < 400; i++) {
    deskCtx.lineWidth = 1 + Math.random() * 3;
    deskCtx.beginPath();
    const x = Math.random() * 1024;
    deskCtx.moveTo(x, 0);
    deskCtx.lineTo(x + (Math.random() - 0.5) * 40, 1024);
    deskCtx.stroke();
  }

  // Matrix circuit overlay in center around monitor
  const deskCenterGrad = deskCtx.createRadialGradient(512, 400, 40, 512, 400, 360);
  deskCenterGrad.addColorStop(0, "rgba(0, 45, 15, 0.95)");
  deskCenterGrad.addColorStop(0.5, "rgba(0, 25, 8, 0.6)");
  deskCenterGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
  deskCtx.fillStyle = deskCenterGrad;
  deskCtx.fillRect(0, 0, 1024, 1024);

  // Digital green cyber traces
  deskCtx.strokeStyle = "rgba(0, 255, 102, 0.28)";
  deskCtx.lineWidth = 2;
  for (let r = 50; r <= 320; r += 45) {
    deskCtx.beginPath();
    deskCtx.arc(512, 400, r, 0, Math.PI * 2);
    deskCtx.stroke();
  }
  for (let a = 0; a < Math.PI * 2; a += Math.PI / 8) {
    deskCtx.beginPath();
    deskCtx.moveTo(512, 400);
    deskCtx.lineTo(512 + Math.cos(a) * 320, 400 + Math.sin(a) * 320);
    deskCtx.stroke();
  }

  const deskTexture = new THREE.CanvasTexture(deskCanvas);

  // Interactive Clickable Objects Registry
  const interactiveObjects = [];

  function registerInteractive(rootObj, id, name, icon, infoSnippet) {
    const meta = { id, name, icon, infoSnippet };
    rootObj.userData = meta;
    rootObj.traverse((child) => {
      if (child.isMesh) {
        child.userData = meta;
      }
    });
    interactiveObjects.push(rootObj);
  }

  // 7- DESK: Wooden exterior, Matrix digital convergence in center
  const deskGeo = new THREE.BoxGeometry(11, 0.35, 6.5);
  const deskMat = new THREE.MeshStandardMaterial({
    map: deskTexture,
    roughness: 0.55,
    metalness: 0.2,
  });
  const desk = new THREE.Mesh(deskGeo, deskMat);
  desk.position.set(0, -0.175, 0.2);
  desk.receiveShadow = true;
  scene.add(desk);

  // Desk metal legs
  const legGeo = new THREE.CylinderGeometry(0.08, 0.08, 6, 16);
  const legMat = new THREE.MeshStandardMaterial({ color: 0x111612, metalness: 0.8, roughness: 0.3 });
  [[-5.2, -3, -2.7], [5.2, -3, -2.7], [-5.2, -3, 3.2], [5.2, -3, 3.2]].forEach(([x, y, z]) => {
    const leg = new THREE.Mesh(legGeo, legMat);
    leg.position.set(x, y, z);
    scene.add(leg);
  });

  // 1- TÜPLÜ CRT MONİTÖR (Vintage Cathode Ray Tube Monitor)
  const monitorGroup = new THREE.Group();
  monitorGroup.position.set(0, 0, -1.05);
  monitorGroup.rotation.x = -0.07; // Ergonomic upward tilt towards standing player eyes

  // Vintage monitor plastic material (Aged dark cyber green-grey polymer)
  const crtChassisMat = new THREE.MeshStandardMaterial({
    color: 0x131d16,
    roughness: 0.52,
    metalness: 0.25
  });

  const crtAccentMat = new THREE.MeshStandardMaterial({
    color: 0x09120c,
    roughness: 0.4,
    metalness: 0.5
  });

  // A. Swivel Pedestal Base (Ağır Döner Taban)
  const standBase = new THREE.Mesh(
    new THREE.CylinderGeometry(0.85, 1.05, 0.16, 32),
    crtChassisMat
  );
  standBase.position.y = 0.08;
  standBase.castShadow = true;
  standBase.receiveShadow = true;
  monitorGroup.add(standBase);

  // Stand Swivel Neck (Pivot mafsal)
  const standNeck = new THREE.Mesh(
    new THREE.CylinderGeometry(0.34, 0.38, 0.36, 24),
    crtAccentMat
  );
  standNeck.position.y = 0.28;
  standNeck.castShadow = true;
  monitorGroup.add(standNeck);

  // B. Thick Front Bezel Housing (Kalın Ön Çerçeve)
  const frontBezel = new THREE.Mesh(
    new THREE.BoxGeometry(3.5, 2.7, 0.5),
    crtChassisMat
  );
  frontBezel.position.set(0, 1.6, 0.15);
  frontBezel.castShadow = true;
  frontBezel.receiveShadow = true;
  monitorGroup.add(frontBezel);

  // Front Bezel Inner Inset / Lip (Tüp yuva girintisi)
  const bezelLip = new THREE.Mesh(
    new THREE.BoxGeometry(3.1, 2.3, 0.15),
    crtAccentMat
  );
  bezelLip.position.set(0, 1.68, 0.38);
  monitorGroup.add(bezelLip);

  // C. Deep Cathode Ray Tube Funnel (Arka Büyük Tüp Haznesi)
  // Classic 4-sided flared pyramid tapering deep backwards into electron gun
  const tubeFunnel = new THREE.Mesh(
    new THREE.CylinderGeometry(0.72, 1.95, 2.2, 4),
    crtChassisMat
  );
  tubeFunnel.rotation.x = -Math.PI / 2;
  tubeFunnel.rotation.y = Math.PI / 4; // square alignment
  tubeFunnel.position.set(0, 1.6, -1.05);
  tubeFunnel.castShadow = true;
  monitorGroup.add(tubeFunnel);

  // Rear Electron Gun Neck Housing (Elektron Tabancası Silindirik Tüp Sonu)
  const gunNeck = new THREE.Mesh(
    new THREE.CylinderGeometry(0.48, 0.52, 0.85, 24),
    crtAccentMat
  );
  gunNeck.rotation.x = -Math.PI / 2;
  gunNeck.position.set(0, 1.6, -2.4);
  gunNeck.castShadow = true;
  monitorGroup.add(gunNeck);

  // Tube Neck End Cap with Ventilation Slots
  const neckEndCap = new THREE.Mesh(
    new THREE.CylinderGeometry(0.46, 0.46, 0.08, 24),
    new THREE.MeshStandardMaterial({ color: 0x050a07, roughness: 0.8 })
  );
  neckEndCap.rotation.x = -Math.PI / 2;
  neckEndCap.position.set(0, 1.6, -2.85);
  monitorGroup.add(neckEndCap);

  // Top Ventilation Grilles (Üst Soğutma Havalandırma Izgaraları)
  for (let g = 0; g < 6; g++) {
    const ventSlat = new THREE.Mesh(
      new THREE.BoxGeometry(2.1, 0.04, 0.12),
      crtAccentMat
    );
    ventSlat.position.set(0, 2.68 - g * 0.1, -0.4 - g * 0.22);
    monitorGroup.add(ventSlat);
  }

WITH SessionMetrics AS (
  SELECT 
    player_id,
    session_id,
    map_id,
    damage_dealt,
    ROW_NUMBER() OVER (PARTITION BY player_id ORDER BY session_start) AS run_number,
    LAG(damage_dealt, 1, 0) OVER (PARTITION BY player_id ORDER BY session_start) AS prev_damage,
    AVG(damage_dealt) OVER (PARTITION BY map_id) AS map_avg_damage
  FROM fact_gameplay_events
  WHERE event_timestamp >= CURRENT_DATE - INTERVAL '30 days'
)
SELECT 
  player_id,
  run_number,
  damage_dealt,
  ROUND(((damage_dealt - prev_damage)::numeric / NULLIF(prev_damage, 0)) * 100, 2) AS damage_growth_pct,

FROM SessionMetrics

        content.classList.add('hidden');

    });
  };

  // Close Modal Handler
  function closeModal() {
    playSound('hover');
    modalBackdrop.classList.add('hidden');
    modalBackdrop.classList.remove('flex');
  }

  modalCloseBtn.addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', (e) => {
    if (e.target === modalBackdrop) closeModal();
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  window.addEventListener('click', (event) => {
    // If clicking outside 3D canvas (on HUD / modal), ignore
    if (event.target.closest('#modal-card') || event.target.closest('header') || event.target.closest('footer')) {
      return;
    }

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(interactiveObjects, true);

    if (intersects.length > 0) {
      // Find registered interactive parent/userData
      let hit = intersects[0].object;
      while (hit && !hit.userData?.id && hit.parent) {
        hit = hit.parent;
      }
      if (hit && hit.userData?.id) {
        openModal(hit.userData.id);
      }
    }
  });

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);

    const elapsedTime = clock.getElapsedTime();

    // 1. Update CRT Falling Code Matrix Texture
    updateCrtMatrixScreen(elapsedTime);

    // 2. Subtle origami rabbit breathing / hovering pulse
    rabbitGroup.position.y = 0.02 + Math.sin(elapsedTime * 2.5) * 0.02;
    rabbitRune.rotation.z = elapsedTime * 0.4;

    // 3. CRT Monitor light flicker for authentic retro tube feel
    crtGlowLight.intensity = 3.0 + Math.sin(elapsedTime * 12) * 0.2 + (Math.random() - 0.5) * 0.15;

    // 4. Subtle camera look parallax around standing position
    camera.position.x = defaultCamPos.x + (mouseParallax.x - camera.position.x) * 0.05;
    camera.position.y = defaultCamPos.y + (mouseParallax.y - (camera.position.y - defaultCamPos.y)) * 0.05;
    camera.lookAt(defaultLookAt);

    // 5. Raycasting for hover state & HUD feedback
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(interactiveObjects, true);

    if (intersects.length > 0) {
      let hit = intersects[0].object;
      while (hit && !hit.userData?.id && hit.parent) {
        hit = hit.parent;
      }

      if (hit && hit.userData?.id) {
        if (hoveredObject !== hit) {
          hoveredObject = hit;
          playSound('hover');
          container.style.cursor = 'pointer';
          targetLabel.innerHTML = `<span class="text-xl mr-2">${hit.userData.icon}</span> <strong class="text-green-300 font-bold">${hit.userData.name}</strong> — <span class="text-xs text-green-400/80">${hit.userData.infoSnippet} (Tıkla)</span>`;
          interactionHud.classList.add('border-green-400', 'bg-green-950/80', 'scale-105');
        }
      }
    } else {
      if (hoveredObject) {
        hoveredObject = null;
        container.style.cursor = 'default';
        targetLabel.innerHTML = `👁️ Masa üzerindeki 3D nesneleri keşfetmek için tıklayın`;
        interactionHud.classList.remove('border-green-400', 'bg-green-950/80', 'scale-105');
      }
    }

    renderer.render(scene, camera);
  }

  // Window Resize Adaptation
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // Start after window load
  window.onload = function () {
    animate();
  };
